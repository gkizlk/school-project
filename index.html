            'завтрак': 'питание',
            'еда': 'питание',
            'кормят': 'питание',
            'медаль': 'достижение',
            'медали': 'достижение',
            'олимпиада': 'достижение',
            'призёры': 'достижение',
            'призеры': 'достижение',
            'победители': 'достижение',
            'достижения': 'достижение',
            'результаты': 'достижение'
        };

        const QUERY_EXPANSIONS = {
            director: ['директор руководитель глава администрация школа'],
            location: ['адрес расположение где находится школа'],
            curriculum: ['учебный план предметы уроки дисциплины'],
            staff: ['учителя педагоги преподаватели состав коллектив'],
            chemistry: ['учитель химии химия лабораторные работы'],
            russian: ['учитель русского языка и литературы'],
            english: ['учитель английского языка'],
            math: ['учитель математики вероятность и статистика'],
            physics: ['учитель физики эксперименты'],
            biology: ['учитель биологии'],
            history_social: ['учитель истории обществознания'],
            geography: ['учитель географии'],
            technology: ['учитель технологии труд'],
            obzr: ['ОБЗР основы безопасности и защиты Родины'],
            informatics: ['учитель информатики компьютеры'],
            pe: ['учитель физкультуры спорт'],
            music: ['учитель музыки'],
            food: ['столовая питание меню'],
            achievements: ['олимпиада призёры победители медали'],
            admissions: ['поступление заявление телефон']
        };

        const TOPIC_PATTERNS = {
            director: ['директор', 'руководитель', 'глава', 'администрация', 'африкян'],
            location: ['где', 'адрес', 'расположена', 'расположен', 'находится', 'излучинск', 'посёлок', 'поселок'],
            curriculum: ['предмет', 'предметы', 'урок', 'уроки', 'дисциплина', 'учебный план', 'обучение'],
            staff: ['учителя', 'учителей', 'педагоги', 'педагогический состав', 'педсостав', 'коллектив', 'состав'],
            chemistry: ['химия', 'химию', 'химии', 'лабораторные'],
            russian: ['русский', 'литература', 'русского', 'литературы'],
            english: ['английский', 'иностранный', 'английского'],
            math: ['математика', 'вероятность', 'статистика', 'математик'],
            physics: ['физика', 'физику', 'физики'],
            biology: ['биология', 'биологию', 'биологии'],
            history_social: ['история', 'обществознание'],
            geography: ['география', 'географию', 'географии'],
            technology: ['технология', 'труд'],
            obzr: ['обзр', 'обж', 'безопасность'],
            informatics: ['информатика', 'икт', 'компьютер', 'программирование'],
            pe: ['физкультура', 'физическая культура', 'спорт'],
            music: ['музыка', 'музыку'],
            food: ['столовая', 'питание', 'меню', 'обед', 'завтрак'],
            achievements: ['олимпиада', 'медали', 'медаль', 'призёры', 'призеры', 'победители', 'достижения'],
            admissions: ['поступление', 'заявление', 'приём', 'прием', 'зачисление', 'записаться', 'телефон', 'контакты']
        };

        const MODEL_CANDIDATES = [
            { id: 'Xenova/multilingual-e5-small', kind: 'e5' },
            { id: 'Xenova/paraphrase-multilingual-MiniLM-L12-v2', kind: 'mini' }
        ];

        const unique = arr => [...new Set(arr.filter(Boolean))];

        const normalizeForSearch = (text) => {
            return (text || '')
                .toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/[“”"«»'`.,!?;:()[\]{}<>\/\\|@#$%^&*_+=~—-]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        };

        const stemRu = (word) => {
            let w = normalizeForSearch(word).replace(/\s+/g, '');
            if (w.length <= 3) return w;

            for (const suf of STEM_SUFFIXES) {
                if (w.length > suf.length + 2 && w.endsWith(suf)) {
                    w = w.slice(0, -suf.length);
                    break;
                }
            }

            return w;
        };

        const normalizeToken = (token) => {
            const stem = stemRu(token);
            return TOKEN_SYNONYMS[stem] || TOKEN_SYNONYMS[token] || stem;
        };

        const tokenize = (text) => {
            return normalizeForSearch(text)
                .split(/\s+/)
                .map(normalizeToken)
                .filter(tok => tok && tok.length > 1 && !STOPWORDS.has(tok));
        };

        const levenshtein = (a, b) => {
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;

            const matrix = Array.from({ length: b.length + 1 }, () => []);
            for (let i = 0; i <= b.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    matrix[i][j] = b[i - 1] === a[j - 1]
                        ? matrix[i - 1][j - 1]
                        : Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                }
            }

            return matrix[b.length][a.length];
        };

        const cosineSimilarity = (vecA, vecB) => {
            let dot = 0, normA = 0, normB = 0;
            const len = Math.min(vecA.length, vecB.length);
            for (let i = 0; i < len; i++) {
                dot += vecA[i] * vecB[i];
                normA += vecA[i] * vecA[i];
                normB += vecB[i] * vecB[i];
            }
            return dot / (Math.sqrt(normA) * Math.sqrt(normB) + 1e-8);
        };

        const isGarbageQuery = (text) => {
            const n = normalizeForSearch(text);
            if (!n) return true;

            const letters = (n.match(/[a-zа-яё]/gi) || []).length;
            if (letters < 2) return true;

            const compact = n.replace(/\s/g, '');
            if (compact.length < 3) return true;
            if (/^(.)\1{3,}$/.test(compact)) return true;
            if (/(.)\1{4,}/.test(compact)) return true;
            if (!/[а-яёa-z]/i.test(n)) return true;

            const tokens = tokenize(n);
            if (tokens.length === 0) return true;

            const hasNormalToken = tokens.some(t => t.length >= 3 || SHORT_OK.has(t));
            if (!hasNormalToken) return true;

            if (tokens.length === 1 && tokens[0].length < 3 && !SHORT_OK.has(tokens[0])) return true;

            return false;
        };

        const detectTopic = (text) => {
            const n = normalizeForSearch(text);
            const t = new Set(tokenize(n));

            let bestTopic = 'general';
            let bestScore = 0;

            for (const [topic, patterns] of Object.entries(TOPIC_PATTERNS)) {
                let score = 0;
                for (const p of patterns) {
                    const pp = normalizeForSearch(p);
                    if (pp.includes(' ')) {
                        if (n.includes(pp)) score += 2;
                    } else {
                        const stem = normalizeToken(pp);
                        if (t.has(stem) || t.has(pp)) score += 1;
                    }
                }
                if (score > bestScore) {
                    bestScore = score;
                    bestTopic = topic;
                }
            }

            return bestScore >= 1 ? bestTopic : 'general';
        };

        const applyQueryRules = (text) => {
            let out = normalizeForSearch(text);

            out = out
                .replace(/\bкто\s+(?:ведет|ведёт|преподает|преподаёт|учит)\b/g, 'учитель')
                .replace(/\bкто\s+директор\b/g, 'директор')
                .replace(/\bкто\s+работает\b/g, 'состав')
                .replace(/\bгде\s+(?:находится|расположена|расположен)\b/g, 'адрес')
                .replace(/\bкакие\s+предметы\b/g, 'предметы')
                .replace(/\bкакие\s+уроки\b/g, 'предметы')
                .replace(/\bкак\s+поступить\b/g, 'поступление')
                .replace(/\bкак\s+записаться\b/g, 'поступление')
                .replace(/\bприем\s+заявлений\b/g, 'поступление')
                .replace(/\bпитание\b/g, 'столовая')
                .replace(/\bстоловая\b/g, 'столовая')
                .replace(/\bдостижения\b/g, 'результаты')
                .replace(/\bпобедители\b/g, 'результаты')
                .replace(/\bпризеры\b/g, 'результаты')
                .replace(/\bпризёры\b/g, 'результаты')
                .replace(/\bмедали\b/g, 'результаты');

            return out.replace(/\s+/g, ' ').trim();
        };

        const buildQueryVariants = (inputText) => {
            const normalized = normalizeForSearch(inputText);
            const canonical = applyQueryRules(inputText);
            const topic = detectTopic(inputText);
            const tokens = tokenize(canonical);

            const variants = new Set([
                normalized,
                canonical,
                tokens.join(' ')
            ]);

            if (QUERY_EXPANSIONS[topic]) {
                variants.add(`${canonical} ${QUERY_EXPANSIONS[topic].join(' ')}`);
            }

            if (/(кто|чей|чья|чьё|чье)\s+(ведет|ведёт|преподает|преподаёт|учит)/.test(normalized)) {
                variants.add(`${canonical} учитель преподаватель`);
            }

            if (/(где|адрес|находится|расположена|расположен)/.test(normalized)) {
                variants.add(`${canonical} расположение посёлок школа`);
            }

            return [...variants].filter(Boolean);
        };

        const detectFactTopic = (factText) => detectTopic(factText);

        const buildFactProfile = (fact) => {
            const booster = unique([
                ...(fact.keywords || []).map(normalizeForSearch),
                ...tokenize(fact.text)
            ]);

            return {
                ...fact,
                topic: detectFactTopic(fact.text),
                searchText: unique([
                    fact.text,
                    (fact.keywords || []).join(' ')
                ]).join(' '),
                normalizedText: normalizeForSearch(fact.text),
                tokens: unique(tokenize(`${fact.text} ${(fact.keywords || []).join(' ')}`)),
                anchors: booster
            };
        };

        const factProfiles = facts.map(buildFactProfile);

        const computeLexicalScore = (queryText, factProfile) => {
            const qTokens = unique(tokenize(queryText));
            const fTokens = new Set(factProfile.tokens || []);

            if (qTokens.length === 0) return 0;

            let exact = 0;
            let fuzzy = 0;

            for (const qt of qTokens) {
                if (fTokens.has(qt)) {
                    exact++;
                    continue;
                }

                if (qt.length < 4) continue;

                let matched = false;
                for (const ft of fTokens) {
                    if (Math.abs(ft.length - qt.length) > 2) continue;
                    const maxDistance = qt.length <= 4 ? 1 : 2;
                    if (levenshtein(qt, ft) <= maxDistance) {
                        matched = true;
                        break;
                    }
                }
                if (matched) fuzzy++;
            }

            const exactScore = exact / qTokens.length;
            const fuzzyScore = fuzzy / qTokens.length;

            const nQuery = normalizeForSearch(queryText);
            let phraseBoost = 0;

            for (const anchor of (factProfile.anchors || [])) {
                if (!anchor || anchor.length < 4) continue;
                if (anchor.includes(' ') && nQuery.includes(anchor)) {
                    phraseBoost = Math.max(phraseBoost, Math.min(0.25, 0.06 * anchor.split(' ').length));
                }
            }

            return Math.min(1, exactScore * 0.75 + fuzzyScore * 0.2 + phraseBoost);
        };

        const calculateDynamicThreshold = (inputText, lexicalScore = 0) => {
            const tokens = tokenize(inputText);
            const count = tokens.length;

            let threshold = 0.47;
            if (count <= 1) threshold = 0.58;
            else if (count <= 2) threshold = 0.54;
            else if (count <= 4) threshold = 0.49;
            else threshold = 0.44;

            if (lexicalScore >= 0.35) threshold -= 0.04;
            if (lexicalScore >= 0.55) threshold -= 0.08;
            if (lexicalScore >= 0.70) threshold -= 0.10;

            return Math.max(0.28, threshold);
        };

        const normalizeEmbeddingOutput = (output) => {
            if (!output) return [];
            if (output.data) return Array.from(output.data);
            if (Array.isArray(output)) return Array.isArray(output[0]) ? output[0] : output;
            if (typeof output.tolist === 'function') {
                const list = output.tolist();
                return Array.isArray(list[0]) ? list[0] : list;
            }
            return [];
        };

        const GenerativeTextAI = () => {
            const [startText, setStartText] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [logs, setLogs] = useState([]);
            const [modelUSE, setModelUSE] = useState(null);
            const [modelKind, setModelKind] = useState(null);
            const [modelName, setModelName] = useState('');
            const [isError, setIsError] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [isProcessing, setIsProcessing] = useState(false);

            const factVectorsRef = useRef([]);
            const addLog = msg => setLogs(prev => [...prev.slice(-8), msg]);

            const loadEmbeddingModel = async () => {
                addLog('Подключение Transformers.js...');
                setLoadingProgress(10);

                const hf = window.__HF;
                if (!hf?.pipeline) {
                    throw new Error('Transformers.js module not loaded');
                }

                const { pipeline } = hf;

                const errors = [];

                for (let i = 0; i < MODEL_CANDIDATES.length; i++) {
                    const candidate = MODEL_CANDIDATES[i];
                    try {
                        addLog(`Пробую модель: ${candidate.id}`);
                        setLoadingProgress(25 + i * 10);

                        const extractor = await pipeline('feature-extraction', candidate.id, {
                            device: 'wasm'
                        });

                        addLog(`✓ Модель загружена: ${candidate.id}`);
                        return {
                            extractor,
                            kind: candidate.kind,
                            name: candidate.id
                        };
                    } catch (err) {
                        const msg = err?.message || String(err);
                        errors.push(`${candidate.id}: ${msg}`);
                        addLog(`⚠ ${candidate.id} не загрузилась`);
                    }
                }

                throw new Error(errors.join(' | ') || 'Не удалось загрузить модель');
            };

            const embedText = async (extractor, kind, text, isQuery = false) => {
                const prepared = kind === 'e5'
                    ? `${isQuery ? 'query:' : 'passage:'} ${text}`
                    : text;

                const output = await extractor(prepared, {
                    pooling: 'mean',
                    normalize: true
                });

                return normalizeEmbeddingOutput(output);
            };

            const prepareFactVectors = async (extractor, kind) => {
                const vectors = [];
                for (const fact of factProfiles) {
                    const vec = await embedText(extractor, kind, fact.searchText, false);
                    vectors.push(vec);
                }
                return vectors;
            };

            const rankFacts = async (inputText) => {
                if (isGarbageQuery(inputText)) {
                    return {
                        fact: null,
                        lexicalScore: 0,
                        semanticScore: 0,
                        combinedScore: 0,
                        reason: 'garbage_query'
                    };
                }

                const normalizedInput = normalizeForSearch(inputText);
                const canonicalInput = applyQueryRules(inputText);
                const topic = detectTopic(inputText);
                const queryVariants = buildQueryVariants(inputText);
                const inputTokens = tokenize(canonicalInput);

                for (const fact of factProfiles) {
                    const anchors = unique([
                        ...(fact.keywords || []).map(normalizeForSearch),
                        normalizeForSearch(fact.text)
                    ]).filter(Boolean);

                    for (const anchor of anchors) {
                        if (anchor.length >= 4 && normalizedInput.includes(anchor)) {
                            return {
                                fact,
                                lexicalScore: 1,
                                semanticScore: 1,
                                combinedScore: 1,
                                reason: `exact:${anchor}`
                            };
                        }
                    }
                }

                let bestLexicalFact = null;
                let bestLexicalScore = -1;
                let bestFactTopic = 'general';

                for (const fact of factProfiles) {
                    let score = computeLexicalScore(canonicalInput, fact);
                    const factTopic = fact.topic;

                    if (topic !== 'general' && factTopic === topic) score += 0.10;
                    if (inputTokens.length <= 2 && topic !== 'general') score += 0.06;

                    if (score > bestLexicalScore) {
                        bestLexicalScore = score;
                        bestLexicalFact = fact;
                        bestFactTopic = factTopic;
                    }
                }

                const lexicalThreshold = inputTokens.length <= 2 ? 0.42 : 0.30;
                const strongLexical = bestLexicalScore >= lexicalThreshold;

                const semanticReady = (
                    modelUSE &&
                    factVectorsRef.current &&
                    factVectorsRef.current.length === factProfiles.length &&
                    inputTokens.length >= 2
                );

                if (!semanticReady) {
                    if (strongLexical) {
                        return {
                            fact: bestLexicalFact,
                            lexicalScore: bestLexicalScore,
                            semanticScore: 0,
                            combinedScore: bestLexicalScore,
                            reason: `lexical_only topic=${bestFactTopic}`
                        };
                    }

                    return {
                        fact: null,
                        lexicalScore: bestLexicalScore,
                        semanticScore: 0,
                        combinedScore: bestLexicalScore,
                        reason: 'not_enough_signal'
                    };
                }

                const queryVectors = [];
                for (const variant of queryVariants) {
                    const qVec = await embedText(modelUSE, modelKind, variant, true);
                    queryVectors.push(qVec);
                }

                let best = null;

                for (let i = 0; i < factProfiles.length; i++) {
                    const fact = factProfiles[i];
                    const factVec = factVectorsRef.current[i];

                    let semanticBest = -1;
                    for (const qVec of queryVectors) {
                        const sim = cosineSimilarity(qVec, factVec);
                        if (sim > semanticBest) semanticBest = sim;
                    }

                    const lexicalScore = computeLexicalScore(canonicalInput, fact);
                    const factTopic = fact.topic;
                    const topicBoost = topic !== 'general' && factTopic === topic ? 0.08 : 0;

                    const combinedScore = (semanticBest * 0.58) + (lexicalScore * 0.34) + topicBoost;

                    if (!best || combinedScore > best.combinedScore) {
                        best = {
                            fact,
                            semanticScore: semanticBest,
                            lexicalScore,
                            combinedScore,
                            reason: `semantic topic=${topic} factTopic=${factTopic}`
                        };
                    }
                }

                const threshold = calculateDynamicThreshold(inputText, best?.lexicalScore || 0);

                if (!best) {
                    return {
                        fact: null,
                        lexicalScore: 0,
                        semanticScore: 0,
                        combinedScore: 0,
                        reason: 'no_best'
                    };
                }

                const acceptable = (
                    best.combinedScore >= threshold ||
                    (best.lexicalScore >= 0.42 && best.semanticScore >= 0.32)
                );

                if (!acceptable) {
                    return {
                        fact: null,
                        lexicalScore: best.lexicalScore,
                        semanticScore: best.semanticScore,
                        combinedScore: best.combinedScore,
                        reason: `below_threshold topic=${topic}`
                    };
                }

                return best;
            };

            const generateText = async () => {
                if (!startText.trim()) {
                    addLog('⚠ Введите запрос');
                    return;
                }

                setIsProcessing(true);
                setGeneratedText('');
                setIsError(false);

                try {
                    if (isGarbageQuery(startText)) {
                        setGeneratedText('Запрос слишком короткий или шумный. Напиши нормальный вопрос, например: "кто директор школы?" или "где находится школа?"');
                        setIsError(true);
                        addLog('⚠ Отброшен мусорный ввод до семантики');
                        return;
                    }

                    if (!modelUSE) {
                        setGeneratedText('Модель ещё не загружена.');
                        setIsError(true);
                        addLog('⚠ Модель ещё не загружена');
                        return;
                    }

                    const result = await rankFacts(startText);

                    if (!result || !result.fact) {
                        setGeneratedText('Факт не найден. Попробуйте спросить о директоре, учителях, местоположении, предметах, питании, поступлении или достижениях школы.');
                        setIsError(true);
                        addLog(`✗ ${result?.reason || 'no_result'} | lexical=${(result?.lexicalScore ?? 0).toFixed(3)} semantic=${(result?.semanticScore ?? 0).toFixed(3)} score=${(result?.combinedScore ?? 0).toFixed(3)}`);
                    } else {
                        setGeneratedText(result.fact.text);
                        setIsError(false);
                        addLog(`✓ ${result.reason} | lexical=${result.lexicalScore.toFixed(3)} semantic=${result.semanticScore.toFixed(3)} score=${result.combinedScore.toFixed(3)}`);
                    }
                } catch (error) {
                    setGeneratedText('Произошла ошибка при поиске. Попробуйте переформулировать вопрос.');
                    setIsError(true);
                    addLog('⚠ Ошибка: ' + (error?.message || error));
                } finally {
                    setIsProcessing(false);
                }
            };

            useEffect(() => {
                (async () => {
                    try {
                        addLog('Загрузка Multilingual E5...');
                        const loaded = await loadEmbeddingModel();

                        setModelUSE(loaded.extractor);
                        setModelKind(loaded.kind);
                        setModelName(loaded.name);

                        setLoadingProgress(60);
                        addLog('Создание векторов фактов...');
                        factVectorsRef.current = await prepareFactVectors(loaded.extractor, loaded.kind);

                        setLoadingProgress(100);
                        addLog('✓ Модель готова к работе');
                        setTimeout(() => setIsLoading(false), 250);
                    } catch (error) {
                        setLoadingProgress(100);
                        addLog('⚠ Семантическая модель недоступна: ' + (error?.message || error));
                        setTimeout(() => setIsLoading(false), 250);
                    }
                })();
            }, []);

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-semibold text-gray-800 mb-2">AIzluchinsk</h1>
                            <p className="text-gray-600">Проект учеников школы МБОУ Излучинская ОСШУИОП №2</p>
                        </div>

                        {isLoading && (
                            <div className="mb-6 bg-white rounded-lg p-6 border shadow-sm">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-gray-700 font-medium">Загрузка semantic engine...</span>
                                    <span className="text-blue-600 font-semibold">{loadingProgress}%</span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                    <div
                                        className="bg-blue-600 h-3 rounded-full transition-all duration-300 ease-out"
                                        style={{ width: `${loadingProgress}%` }}
                                    />
                                </div>
                                <p className="text-sm text-gray-500 mt-2">
                                    Пожалуйста, подождите. Идёт загрузка браузерной модели и векторизация фактов...
                                </p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-2 bg-white rounded-lg p-6 border shadow-sm flex flex-col">
                                <h2 className="text-xl font-semibold mb-3">Информация о школе</h2>
                                <div className="h-64 overflow-y-auto p-3 bg-gray-50 border rounded mb-4 whitespace-pre-wrap text-gray-700">
                                    {defaultTrainingText}
                                </div>
                                <input
                                    value={startText}
                                    onChange={e => setStartText(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && !isLoading && !isProcessing && generateText()}
                                    placeholder="Введите вопрос..."
                                    className="w-full border rounded p-3 mb-3"
                                    disabled={isLoading || isProcessing}
                                />
                                <button
                                    onClick={generateText}
                                    disabled={isLoading || isProcessing}
                                    className="w-full bg-blue-600 text-white py-3 rounded mb-4 hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    {isProcessing ? (
                                        <>
                                            <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                                            </svg>
                                            Обработка...
                                        </>
                                    ) : 'Получить факт'}
                                </button>

                                {generatedText && (
                                    <div className={`border-l-4 ${isError ? 'border-red-600 bg-red-50' : 'border-blue-600 bg-blue-50'} p-4 rounded shadow`}>
                                        <h3 className={`font-semibold ${isError ? 'text-red-800' : 'text-blue-800'} mb-2`}>
                                            {isError ? '⚠ Результат поиска:' : '✓ Релевантный факт:'}
                                        </h3>
                                        <p className="text-gray-800">{generatedText}</p>
                                    </div>
                                )}
                            </div>

                            <div className="flex flex-col gap-6">
                                <div className="bg-white rounded-lg p-6 border shadow-sm">
                                    <h3 className="font-semibold mb-3">Консоль</h3>
                                    <div className="h-64 overflow-y-auto bg-gray-50 p-3 border rounded font-mono text-sm">
                                        {logs.map((l, i) => <div key={i} className="mb-1">{l}</div>)}
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg p-6 border shadow-sm">
                                    <h3 className="font-semibold mb-3">О AIzluchinsk</h3>
                                    <p className="text-gray-700 mb-2">
                                        Это NLP-модель, которая анализирует запросы пользователей и находит наиболее релевантные факты об МБОУ «Излучинская ОСШУИОП №2». Поиск работает в несколько слоёв: точное совпадение, морфологическая нормализация, нечёткий поиск по опечаткам, а затем семантический поиск через браузерную multilingual embedding-модель.
                                    </p>
                                    <p className="text-gray-700 text-sm mt-3 pt-3 border-t">
                                        <strong>Авторы:</strong> Катренко Герман и Мокроусов Матвей
                                    </p>
                                </div>

                                <div className="bg-white rounded-lg p-6 border shadow-sm">
                                    <h3 className="font-semibold mb-3">Текущая модель</h3>
                                    <p className="text-gray-700 text-sm">
                                        {modelName || 'ещё не загружена'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GenerativeTextAI />);
    </script>
</body>
</html>
