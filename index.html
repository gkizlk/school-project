        const defaultTrainingText = `Муниципальное бюджетное общеобразовательное учреждение «Излучинская основная средняя школа с углублённым изучением отдельных предметов № 2» (МБОУ «Излучинская ОСШУИОП № 2») является современной общеобразовательной организацией...`;

        const GenerativeTextAI = () => {
            const [startText, setStartText] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [logs, setLogs] = useState([]);
            const [model, setModel] = useState(null);
            const [isError, setIsError] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [isProcessing, setIsProcessing] = useState(false);

            const factVectorsRef = useRef([]);

            const addLog = msg => setLogs(prev => [...prev.slice(-6), `[${new Date().toLocaleTimeString()}] ${msg}`]);

            const levenshtein = (a, b) => {
                const matrix = [];
                for (let i = 0; i <= b.length; i++) matrix[i] = [i];
                for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        matrix[i][j] = b[i-1] === a[j-1] ? matrix[i-1][j-1] : Math.min(matrix[i-1][j-1]+1, matrix[i][j-1]+1, matrix[i-1][j]+1);
                    }
                }
                return matrix[b.length][a.length];
            };

            const cosineSimilarity = (vecA, vecB) => {
                let dot = 0, normA = 0, normB = 0;
                for (let i = 0; i < vecA.length; i++) {
                    dot += vecA[i]*vecB[i];
                    normA += vecA[i]*vecA[i];
                    normB += vecB[i]*vecB[i];
                }
                return dot / (Math.sqrt(normA)*Math.sqrt(normB) + 1e-8);
            };

            useEffect(() => {
                const initModel = async () => {
                    try {
                        addLog('Инициализация RuBERT (2025 Standard)...');
                        setLoadingProgress(20);

                        // Загружаем пайплайн извлечения признаков
                        const extractor = await window.transformers.pipeline('feature-extraction', 'Xenova/rubert-tiny2');
                        setLoadingProgress(60);
                        setModel(extractor);

                        addLog('Векторизация базы знаний...');
                        const vectors = [];
                        for (let f of facts) {
                            const output = await extractor(f.text, { pooling: 'mean', normalize: true });
                            vectors.push(Object.values(output.data));
                        }
                        factVectorsRef.current = vectors;

                        setLoadingProgress(100);
                        addLog('✓ Система готова (RuBERT-Tiny2)');
                        setTimeout(() => setIsLoading(false), 500);
                    } catch (e) {
                        addLog('⚠ Ошибка: ' + e.message);
                    }
                };

                const checkReady = setInterval(() => {
                    if (window.transformers) {
                        clearInterval(checkReady);
                        initModel();
                    }
                }, 100);
            }, []);

            const generateText = async () => {
                if (!startText.trim() || !model) return;

                setIsProcessing(true);
                const normalizedInput = startText.toLowerCase().trim();
                const inputWords = normalizedInput.split(/\s+/).filter(w => w.length > 1);

                // Уровень 1: Точные ключевые слова
                for (let f of facts) {
                    if (inputWords.some(word => f.keywords.includes(word))) {
                        setGeneratedText(f.text);
                        setIsError(false);
                        addLog(`✓ Уровень 1: Ключевое слово найдено`);
                        setIsProcessing(false);
                        return;
                    }
                }

                // Уровень 2: Левенштейн
                for (let f of facts) {
                    for (let word of inputWords) {
                        for (let kw of f.keywords) {
                            if (levenshtein(word, kw) <= 1 && kw.length > 4) {
                                setGeneratedText(f.text);
                                setIsError(false);
                                addLog(`✓ Уровень 2: Нечёткий поиск (${word} ≈ ${kw})`);
                                setIsProcessing(false);
                                return;
                            }
                        }
                    }
                }

                // Уровень 3: Семантика (RuBERT)
                addLog('Семантический анализ запроса...');
                const output = await model(normalizedInput, { pooling: 'mean', normalize: true });
                const inputVec = Object.values(output.data);

                let bestIdx = -1;
                let maxSim = -1;

                for (let i = 0; i < factVectorsRef.current.length; i++) {
                    const sim = cosineSimilarity(inputVec, factVectorsRef.current[i]);
                    if (sim > maxSim) {
                        maxSim = sim;
                        bestIdx = i;
                    }
                }

                // Для RuBERT-tiny2 порог обычно выше, 0.65 - 0.75
                if (maxSim > 0.68) {
                    setGeneratedText(facts[bestIdx].text);
                    setIsError(false);
                    addLog(`✓ Уровень 3: Релевантность ${maxSim.toFixed(2)}`);
                } else {
                    setGeneratedText('Факт не найден. Попробуйте уточнить вопрос (например, про директора, учителей или питание).');
                    setIsError(true);
                    addLog(`✗ Низкая схожесть: ${maxSim.toFixed(2)}`);
                }

                setIsProcessing(false);
            };

            return (
                <div className="min-h-screen bg-gray-50 p-6 font-sans">

                                        className="flex-1 border-2 border-gray-100 rounded-xl p-4 focus:border-blue-500 outline-none transition-all"

                                    <button
                                        onClick={generateText}
                                        disabled={isLoading || isProcessing}

                                )}
                                
                                <div className="mt-6">
                                    <h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Область знаний:</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {["Директор", "Учителя", "Адрес", "Питание", "Олимпиады", "Предметы"].map(t => (
                                            <span key={t} className="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs">{t}</span>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-gray-900 rounded-xl p-5 border shadow-lg text-green-400 font-mono text-xs">
                                    <h3 className="text-gray-500 mb-3 border-b border-gray-800 pb-2">DEBUG_CONSOLE v2.0</h3>
                                    <div className="space-y-1 h-40 overflow-y-auto">
                                        {logs.map((l, i) => <div key={i} className="opacity-90">{l}</div>)}
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl p-6 border shadow-sm">
                                    <h3 className="font-bold mb-3 text-gray-800">О технологии</h3>
                                    <p className="text-sm text-gray-600 leading-relaxed">
                                        Этот узел использует <strong>Transformers.js</strong> и модель <strong>RuBERT-Tiny2</strong>. 
                                        В отличие от старого USE, RuBERT лучше понимает падежи, морфологию и контекст русского языка, 
                                        работая полностью на стороне клиента.
                                    </p>
                                    <div className="mt-4 pt-4 border-t text-[10px] text-gray-400">
                                        МБОУ «Излучинская ОСШУИОП №2» | 2024-2026
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<GenerativeTextAI />, document.getElementById('root'));
    </script>
</body>
</html>
