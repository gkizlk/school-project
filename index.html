            teachers: ['учитель', 'учителя', 'учителей', 'педагог', 'педагоги', 'преподаватель', 'преподаватели', 'кто ведёт', 'кто ведет', 'кто преподаёт', 'кто преподает', 'состав', 'коллектив', 'педсостав'],
            subjects: ['математика', 'русский язык', 'литература', 'английский язык', 'химия', 'физика', 'информатика', 'география', 'обществознание', 'история', 'технология', 'обзр', 'обж', 'биология', 'музыка', 'физкультура', 'физическая культура', 'вероятность', 'статистика'],
            contacts: ['телефон', 'номер', 'контакты', 'контакт', 'связаться', 'позвонить', 'заявление', 'приём', 'прием', 'поступление', 'запись', 'записаться'],
            food: ['питание', 'столовая', 'еда', 'обед', 'завтрак', 'меню', 'кормят', 'посадочные места'],
            achievements: ['достижения', 'результаты', 'победы', 'медали', 'олимпиада', 'призёры', 'призеры', 'победители'],
        };

        const SYNONYMS = {
            директор: ['директор', 'руководитель', 'глава', 'администрация', 'начальник', 'заведующий', 'заведует', 'управляет'],
            учитель: ['учитель', 'педагог', 'преподаватель', 'педсостав', 'педагогический', 'состав', 'преподы', 'кто ведет', 'кто ведёт', 'кто преподает', 'кто преподаёт'],
            школа: ['школа', 'школьный', 'учебное заведение', 'лицей', 'гимназия', 'образовательная организация'],
            математика: ['математика', 'алгебра', 'геометрия', 'вероятность', 'статистика', 'матан', 'математик'],
            русский: ['русский', 'русский язык', 'литература', 'словесность'],
            английский: ['английский', 'английский язык', 'иностранный', 'инглиш', 'english'],
            химия: ['химия', 'химик', 'химичка', 'лабораторные', 'реакции'],
            физика: ['физика', 'физик', 'эксперименты', 'механика', 'электричество'],
            биология: ['биология', 'биолог', 'природа', 'живое', 'организмы'],
            история: ['история', 'историк', 'прошлое', 'обществознание'],
            информатика: ['информатика', 'икт', 'компьютер', 'программирование', 'цифровые технологии'],
            технология: ['технология', 'труд', 'мастерская', 'ручной труд'],
            физкультура: ['физкультура', 'физическая культура', 'спорт', 'физра', 'урок спорта'],
            музыка: ['музыка', 'муз', 'музык'],
            география: ['география', 'географ', 'карта', 'страны'],
            обзр: ['обзр', 'обж', 'безопасность', 'защита родины', 'основы безопасности'],
            питание: ['питание', 'столовая', 'еда', 'обед', 'завтрак', 'меню', 'кормят'],
            достижения: ['достижения', 'результаты', 'успехи', 'победы', 'медали', 'олимпиада', 'призёры', 'призеры'],
            social: ['вк', 'vk', 'вконтакте', 'соцсети', 'соцсеть', 'социальные сети', 'группа', 'паблик', 'фото', 'фотки', 'фотографии', 'новости', 'объявления', 'видео'],
        };

        const STOPWORDS = new Set([
            'и', 'в', 'во', 'на', 'но', 'а', 'к', 'ко', 'с', 'со', 'по', 'за', 'от', 'до', 'из', 'у', 'для', 'о', 'об', 'обо',
            'что', 'кто', 'где', 'как', 'какой', 'какая', 'какие', 'каких', 'какому', 'каким', 'какую', 'ли', 'же', 'или', 'это',
            'тот', 'та', 'те', 'то', 'весь', 'все', 'всех', 'вся', 'его', 'её', 'их', 'там', 'тут', 'сюда', 'туда', 'здесь', 'нет',
            'бы', 'уж', 'ну'
        ]);

        const RU_VOWELS = new Set(['а', 'е', 'ё', 'и', 'о', 'у', 'ы', 'э', 'ю', 'я']);
        const ABBREVIATIONS = new Set(['обж', 'обзр', 'икт', 'егэ', 'огэ', 'впр', 'гэ', 'мбоу', 'сош', 'осш', 'фгос']);

        const normalizeText = (text) => (
            (text || '')
                .toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/№/g, ' номер ')
                .replace(/[\u2013\u2014]/g, ' ')
                .replace(/['’`]/g, '')
                .replace(/[^a-zа-я0-9]+/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim()
        );

        const tokenize = (text) => normalizeText(text).split(' ').filter(Boolean);

        const hasVowel = (word) => [...word].some(ch => RU_VOWELS.has(ch));

        const stemRu = (word) => {
            let w = normalizeText(word);
            if (!w) return '';
            if (w.length <= 3) return w;

            const suffixes = [
                'иями', 'ями', 'ами', 'его', 'ого', 'ему', 'ому', 'ыми', 'ими',
                'иях', 'ьях', 'ах', 'ях', 'ам', 'ям', 'ом', 'ем',
                'ей', 'ой', 'ий', 'ый', 'ая', 'яя', 'ое', 'ее', 'ую', 'юю',
                'ов', 'ев', 'ие', 'ые', 'их', 'ых', 'ия', 'ья', 'ию', 'ью',
                'а', 'я', 'е', 'и', 'ы', 'о', 'у', 'ю', 'ь'
            ];

            for (const suffix of suffixes) {
                if (w.length > 4 && w.endsWith(suffix)) {
                    const sliced = w.slice(0, -suffix.length);
                    if (sliced.length >= 3) return sliced;
                }
            }

            return w;
        };

        const cosineSimilarity = (vecA, vecB) => {
            let dot = 0;
            let normA = 0;
            let normB = 0;
            const len = Math.min(vecA.length, vecB.length);

            for (let i = 0; i < len; i++) {
                dot += vecA[i] * vecB[i];
                normA += vecA[i] * vecA[i];
                normB += vecB[i] * vecB[i];
            }

            return dot / (Math.sqrt(normA) * Math.sqrt(normB) + 1e-8);
        };

        const charNgrams = (text, n = 3) => {
            const compact = normalizeText(text).replace(/\s+/g, '');
            const grams = new Set();
            if (compact.length < n) {
                if (compact) grams.add(compact);
                return grams;
            }
            for (let i = 0; i <= compact.length - n; i++) {
                grams.add(compact.slice(i, i + n));
            }
            return grams;
        };

        const jaccard = (setA, setB) => {
            if (!setA.size || !setB.size) return 0;
            let intersection = 0;
            for (const item of setA) {
                if (setB.has(item)) intersection++;
            }
            return intersection / (setA.size + setB.size - intersection + 1e-8);
        };

        const buildCharProfile = (factsList, n = 3, limit = 220) => {
            const freq = new Map();

            for (const fact of factsList) {
                const source = `${fact.text} ${fact.keywords.join(' ')}`;
                const compact = normalizeText(source).replace(/[^a-zа-я]+/gi, '');
                if (compact.length < n) continue;

                for (let i = 0; i <= compact.length - n; i++) {
                    const gram = compact.slice(i, i + n);
                    freq.set(gram, (freq.get(gram) || 0) + 1);
                }
            }

            return new Set(
                [...freq.entries()]
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, limit)
                    .map(([gram]) => gram)
            );
        };

        const COMMON_TRIGRAMS = buildCharProfile(facts, 3, 260);

        const charProfileHitRate = (text, profile = COMMON_TRIGRAMS, n = 3) => {
            const compact = normalizeText(text).replace(/\s+/g, '');
            if (compact.length < n) return 0;

            let hits = 0;
            let total = 0;

            for (let i = 0; i <= compact.length - n; i++) {
                total++;
                if (profile.has(compact.slice(i, i + n))) hits++;
            }

            return total ? hits / total : 0;
        };

        const countConsonantClusters = (word) => {
            const matches = word.match(/[бвгджзйклмнпрстфхцчшщ]{4,}/gi);
            return matches ? matches.length : 0;
        };

        const tokenNoiseScore = (token) => {
            if (!token) return 0;
            let score = 0;
            const hasLetters = /[a-zа-я]/i.test(token);
            const hasDigits = /\d/.test(token);

            if (ABBREVIATIONS.has(token)) return 1;

            if (hasDigits && hasLetters) score -= 1.1;
            else if (hasDigits) score -= 0.9;

            if (STOPWORDS.has(token)) score += 0.2;
            if (hasLetters) score += 0.15;

            if (hasVowel(token)) score += 0.5;
            else if (token.length > 3) score -= 0.65;

            if (token.length >= 6 && countConsonantClusters(token) > 0) score -= 0.45;
            if (/(.)\1{3,}/.test(token)) score -= 0.9;

            if (/^[a-zа-я]+$/i.test(token) && token.length >= 4) {
                const trigramHitRate = charProfileHitRate(token);
                if (trigramHitRate >= 0.28) score += 0.45;
                else if (trigramHitRate >= 0.18) score += 0.2;
                else if (trigramHitRate < 0.08) score -= 0.55;
            }

            if (token.length <= 2 && hasLetters) score += 0.1;
            if (token.length >= 10 && !hasVowel(token)) score -= 0.9;

            return score;
        };

        const isWordLike = (token) => {
            if (!token) return false;
            if (ABBREVIATIONS.has(token)) return true;
            if (!/^[a-zа-я0-9]+$/i.test(token)) return false;
            if (/\d/.test(token) && /[a-zа-я]/i.test(token)) return false;
            if (/^\d+$/.test(token)) return false;
            if (/(.)\1{4,}/.test(token)) return false;
            return /[a-zа-я]/i.test(token);
        };

        const levenshtein = (a, b) => {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    matrix[i][j] = b[i - 1] === a[j - 1]
                        ? matrix[i - 1][j - 1]
                        : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                }
            }
            return matrix[b.length][a.length];
        };

        const normalizedEditDistance = (a, b) => {
            const maxLen = Math.max(a.length, b.length);
            if (!maxLen) return 0;
            return levenshtein(a, b) / maxLen;
        };

        const buildTopicLookup = () => {
            const lookup = new Map();
            for (const [topic, words] of Object.entries(TOPIC_GROUPS)) {
                for (const word of words) {
                    const n = normalizeText(word);
                    if (!lookup.has(n)) lookup.set(n, new Set());
                    lookup.get(n).add(topic);
                }
            }
            return lookup;
        };

        const TOPIC_LOOKUP = buildTopicLookup();

        const topicHitsForText = (text) => {
            const tokens = tokenize(text);
            const hits = new Set();
            for (const token of tokens) {
                const n = normalizeText(token);
                if (TOPIC_LOOKUP.has(n)) {
                    for (const t of TOPIC_LOOKUP.get(n)) hits.add(t);
                }
            }
            return hits;
        };

        const buildFactExpansion = (keywords) => {
            const expanded = new Set();
            for (const keyword of keywords) {
                const norm = normalizeText(keyword);
                if (!norm) continue;
                expanded.add(norm);
                const parts = norm.split(' ').filter(Boolean);
                for (const part of parts) {
                    expanded.add(part);
                    expanded.add(stemRu(part));
                }
                const topicHits = topicHitsForText(norm);
                for (const topic of topicHits) {
                    for (const v of TOPIC_GROUPS[topic]) expanded.add(normalizeText(v));
                }
            }
            return expanded;
        };

        const isProbablyGibberish = (text, tokens, expandedTokens) => {
            const normalized = normalizeText(text);
            if (normalized.length < 2) return true;

            const compact = normalized.replace(/\s+/g, '');
            const letters = (compact.match(/[a-zа-я]/gi) || []).length;
            const digits = (compact.match(/\d/g) || []).length;
            const total = compact.length || 1;

            if (letters === 0) return true;

            const scoredTokens = tokens
                .filter(Boolean)
                .map(token => ({ token, score: tokenNoiseScore(token) }));

            const strongTokens = scoredTokens.filter(item => item.score >= 0.42);
            const weakButValidTokens = scoredTokens.filter(item => item.score >= 0.20);

            const semanticHint = charProfileHitRate(normalized);
            const meaningfulTokenCount = strongTokens.length + weakButValidTokens.length;

            if (meaningfulTokenCount === 0 && expandedTokens.length === 0) return true;

            const digitHeavy = digits / total > 0.55;
            const noUsefulShape = scoredTokens.length > 0 && scoredTokens.every(item => item.score < 0.15);

            if (digitHeavy && strongTokens.length === 0) return true;
            if (noUsefulShape) return true;

            if (scoredTokens.length === 1) {
                const only = scoredTokens[0];
                if (only.score < 0.20 && semanticHint < 0.08) return true;
                if (only.score < 0.30 && only.token.length >= 8 && semanticHint < 0.12) return true;
            }

            if (scoredTokens.length <= 2 && semanticHint < 0.08) {
                const hasAnyRealWord = scoredTokens.some(item => item.score >= 0.30);
                if (!hasAnyRealWord && !expandedTokens.length) return true;
            }

            const repeatedJunk = /(.)\1{4,}/.test(normalized);
            return repeatedJunk;
        };

        const normalizeVectorOutput = (output) => {
            if (!output) return [];
            if (typeof output.tolist === 'function') return output.tolist();
            if (Array.isArray(output)) return output;
            if (output.data && Array.isArray(output.data)) return output.data;
            return [];
        };

        const computeDocFreq = (factsList) => {
            const df = new Map();
            for (const fact of factsList) {
                const source = `${fact.text} ${fact.keywords.join(' ')}`;
                const tokens = [...new Set(
                    tokenize(source)
                        .filter(t => t && !STOPWORDS.has(t))
                        .flatMap(t => [t, stemRu(t)])
                        .filter(Boolean)
                )];

                for (const token of tokens) {
                    df.set(token, (df.get(token) || 0) + 1);
                }
            }
            return df;
        };

        const DOC_FREQ = computeDocFreq(facts);
        const DOC_COUNT = facts.length;

        const idf = (token) => {
            const df = DOC_FREQ.get(token) || 0;
            return Math.log((DOC_COUNT + 1) / (df + 1)) + 1;
        };

        const buildFactsIndex = (factsList) => {
            const indexed = [];
            const vocab = new Set();

            for (const fact of factsList) {
                const searchText = `${fact.text} ${fact.keywords.join(' ')}`;
                const textNorm = normalizeText(searchText);
                const rawTokens = tokenize(textNorm).filter(t => t && !STOPWORDS.has(t));
                const tokens = [...new Set(rawTokens)];
                const stems = [...new Set(tokens.map(stemRu).filter(Boolean))];
                const keywordExpansion = buildFactExpansion(fact.keywords);
                const topicHits = topicHitsForText(searchText);
                const topicExpansion = [...topicHits].flatMap(topic => TOPIC_GROUPS[topic].map(normalizeText));

                tokens.forEach(t => vocab.add(t));
                stems.forEach(t => vocab.add(t));
                keywordExpansion.forEach(t => vocab.add(t));

                const tokenWeights = new Map();
                for (const token of [...new Set([...tokens, ...stems])]) {
                    if (!token) continue;
                    tokenWeights.set(token, idf(token));
                }

                const anchorTokens = [...new Set([
                    ...tokens.filter(t => t.length >= 4 && !STOPWORDS.has(t)),
                    ...stems.filter(t => t.length >= 4),
                    ...keywordExpansion,
                    ...topicExpansion
                ])];

                indexed.push({
                    ...fact,
                    searchText,
                    textNorm,
                    tokens,
                    stemSet: new Set(stems),
                    charNgrams: charNgrams(searchText),
                    keywordSet: new Set([...keywordExpansion].map(stemRu).filter(Boolean)),
                    topicSet: new Set([...topicHits]),
                    anchorTokens,
                    tokenWeights
                });
            }

            return { indexed, vocab: [...vocab] };
        };

        const { indexed: SEARCH_INDEX, vocab: VOCAB_LIST } = buildFactsIndex(facts);

        const expandQuery = (text) => {
            const normalized = normalizeText(text);
            const tokens = tokenize(normalized);
            const expanded = new Set();

            for (const token of tokens) {
                if (!token) continue;
                expanded.add(token);

                const stem = stemRu(token);
                if (stem) expanded.add(stem);

                const topicHits = TOPIC_LOOKUP.get(token) || TOPIC_LOOKUP.get(stem);
                if (topicHits) {
                    for (const topic of topicHits) {
                        for (const variant of TOPIC_GROUPS[topic]) expanded.add(normalizeText(variant));
                    }
                }

                for (const [root, variants] of Object.entries(SYNONYMS)) {
                    const rootNorm = normalizeText(root);
                    if (
                        token === rootNorm ||
                        stem === rootNorm ||
                        rootNorm.startsWith(token) ||
                        token.startsWith(rootNorm) ||
                        variants.some(v => {
                            const vn = normalizeText(v);
                            return vn === token || vn === stem;
                        })
                    ) {
                        for (const variant of variants) expanded.add(normalizeText(variant));
                    }
                }

                if (token.length >= 3) {
                    for (const vocabWord of VOCAB_LIST) {
                        if (vocabWord.length < 3) continue;
                        if (vocabWord.startsWith(token) || token.startsWith(vocabWord)) {
                            expanded.add(vocabWord);
                        }
                    }
                }
            }

            return [...expanded];
        };

        const queryWeight = (token) => {
            const n = normalizeText(token);
            if (!n || STOPWORDS.has(n)) return 0;
            return Math.max(0.75, idf(stemRu(n)));
        };

        const tokenMatchScore = (queryToken, factToken) => {
            if (!queryToken || !factToken) return 0;
            if (queryToken === factToken) return 1;
            const qStem = stemRu(queryToken);
            const fStem = stemRu(factToken);
            if (qStem && qStem === fStem) return 0.9;
            if (queryToken.length >= 4 && factToken.startsWith(queryToken)) return 0.85;
            if (factToken.length >= 4 && queryToken.startsWith(factToken)) return 0.8;

            const len = Math.max(queryToken.length, factToken.length);
            if (len < 4) return 0;

            const dist = normalizedEditDistance(queryToken, factToken);
            if (len <= 5 && dist <= 0.25) return 0.72;
            if (len <= 8 && dist <= 0.20) return 0.65;
            if (dist <= 0.15) return 0.58;
            return 0;
        };

        const measureLexicalMatch = (queryTokens, queryExpandedTokens, factIndex) => {
            const fact = SEARCH_INDEX[factIndex];
            const queryTerms = [...new Set([...queryTokens, ...queryExpandedTokens].filter(isWordLike))];
            const queryStemSet = new Set(queryTerms.map(stemRu).filter(Boolean));
            const queryTokenSet = new Set(queryTerms);

            let matchedWeight = 0;
            let totalWeight = 0;
            let exactHits = 0;
            let stemHits = 0;
            let prefixHits = 0;
            let fuzzyHits = 0;
            let anchorHits = 0;
            let topicHits = 0;

            const factTokens = fact.tokens;
            const factStemSet = fact.stemSet;

            for (const token of queryTokenSet) {
                const w = queryWeight(token);
                if (!w) continue;
                totalWeight += w;

                let bestMatch = 0;

                for (const factToken of factTokens) {
                    const s = tokenMatchScore(token, factToken);
                    if (s > bestMatch) bestMatch = s;
                    if (bestMatch === 1) break;
                }

                if (bestMatch > 0) {
                    matchedWeight += w * bestMatch;
                }

                if (factTokens.includes(token)) exactHits++;
                if (factStemSet.has(stemRu(token))) stemHits++;
                if (factTokens.some(f => f.startsWith(token) || token.startsWith(f))) prefixHits++;
                if (factTokens.some(f => token.length >= 4 && f.length >= 4 && levenshtein(token, f) <= 2)) fuzzyHits++;
                if (fact.anchorTokens.some(a => tokenMatchScore(token, a) >= 0.85)) anchorHits++;
            }

            const queryTermCount = queryTokenSet.size || 1;
            const tokenCoverage = queryStemSet.size ? stemHits / queryStemSet.size : 0;
            const exactCoverage = exactHits / queryTermCount;
            const prefixCoverage = prefixHits / queryTermCount;
            const fuzzyCoverage = fuzzyHits / queryTermCount;
            const anchorCoverage = anchorHits / queryTermCount;

            const queryTopics = topicHitsForText(queryTokens.join(' ')).size ? topicHitsForText(queryTokens.join(' ')) : topicHitsForText(queryExpandedTokens.join(' '));
            if (queryTopics.size && fact.topicSet.size) {
                for (const t of queryTopics) {
                    if (fact.topicSet.has(t)) topicHits++;
                }
            }
            const topicCoverage = queryTopics.size ? topicHits / queryTopics.size : 0;

            const queryPhrase = normalizeText([...queryTokens, ...queryExpandedTokens].join(' '));
            const factPhrase = fact.textNorm;

            let phraseBoost = 0;
            if (queryPhrase && factPhrase.includes(queryPhrase)) phraseBoost = 1;
            else {
                const queryParts = queryPhrase.split(' ').filter(Boolean);
                if (queryParts.length >= 2) {
                    const joined = queryParts.slice(0, 2).join(' ');
                    if (factPhrase.includes(joined)) phraseBoost = 0.55;
                }
            }

            const ngramScore = jaccard(charNgrams(queryPhrase || queryTokens.join(' ')), fact.charNgrams);

            const weightedRecall = totalWeight ? matchedWeight / totalWeight : 0;
            const lexical = Math.min(
                1,
                weightedRecall * 0.52 +
                anchorCoverage * 0.16 +
                topicCoverage * 0.14 +
                exactCoverage * 0.08 +
                tokenCoverage * 0.06 +
                prefixCoverage * 0.02 +
                fuzzyCoverage * 0.02 +
                phraseBoost * 0.14 +
                ngramScore * 0.18
            );

            return {
                lexical,
                weightedRecall,
                exactCoverage,
                tokenCoverage,
                prefixCoverage,
                fuzzyCoverage,
                anchorCoverage,
                topicCoverage,
                phraseBoost,
                ngramScore
            };
        };

        const acceptanceThreshold = (queryTokensCount) => {
            if (queryTokensCount <= 1) return 0.52;
            if (queryTokensCount <= 2) return 0.48;
            if (queryTokensCount <= 4) return 0.42;
            if (queryTokensCount <= 7) return 0.37;
            return 0.33;
        };

        const GenerativeTextAI = () => {
            const [startText, setStartText] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [logs, setLogs] = useState([]);
            const [modelUSE, setModelUSE] = useState(null);
            const [isError, setIsError] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [isProcessing, setIsProcessing] = useState(false);

            const factVectorsRef = useRef([]);
            const addLog = (msg) => setLogs(prev => [...prev.slice(-8), msg]);

            const waitForTransformers = async () => {
                for (let i = 0; i < 120; i++) {
                    if (window.HFTransformers?.pipeline) return window.HFTransformers;
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                throw new Error('Transformers.js не загрузился');
            };

            const embedTexts = async (texts, extractor) => {
                const result = await extractor(texts, { pooling: 'mean', normalize: true });
                return normalizeVectorOutput(result);
            };

            useEffect(() => {
                addLog('Подготовка браузерной семантической модели...');
                setLoadingProgress(8);

                (async () => {
                    try {
                        const { pipeline, env } = await waitForTransformers();
                        env.useBrowserCache = true;
                        env.allowRemoteModels = true;

                        setLoadingProgress(20);
                        addLog('Загрузка Transformers.js...');

                        let extractor = null;
                        const device = navigator.gpu ? 'webgpu' : 'wasm';

                        try {
                            extractor = await pipeline('feature-extraction', MODEL_ID, {
                                device,
                                dtype: 'q8'
                            });
                        } catch (firstError) {
                            addLog('Пробую резервную конфигурацию модели...');
                            extractor = await pipeline('feature-extraction', MODEL_ID, {
                                device
                            });
                        }

                        setLoadingProgress(60);
                        addLog(`Модель готова: ${MODEL_ID}`);
                        setModelUSE(() => extractor);

                        addLog('Кэширование эмбеддингов фактов...');
                        const passages = SEARCH_INDEX.map(f => `passage: ${f.searchText}`);
                        const vectors = await embedTexts(passages, extractor);
                        factVectorsRef.current = vectors;

                        setLoadingProgress(100);
                        addLog('✓ Семантический слой активирован');
                        setTimeout(() => setIsLoading(false), 400);
                    } catch (error) {
                        console.error(error);
                        addLog('⚠ Ошибка инициализации: ' + error.message);
                        setGeneratedText('Не удалось загрузить модель семантического поиска.');
                        setIsError(true);
                    }
                })();
            }, []);

            const generateText = async () => {
                if (!startText.trim()) {
                    addLog('⚠ Введите запрос');
                    return;
                }

                if (!modelUSE) {
                    addLog('⚠ Модель ещё не загружена');
                    return;
                }

                setIsProcessing(true);

                const normalizedInput = normalizeText(startText);
                const inputTokens = tokenize(normalizedInput).filter(t => !STOPWORDS.has(t));
                const expandedTokens = expandQuery(normalizedInput);

                if (isProbablyGibberish(startText, inputTokens, expandedTokens)) {
                    setGeneratedText('Запрос не распознан. Попробуйте задать нормальный вопрос о школе.');
                    setIsError(true);
                    addLog('⚠ Запрос похож на мусорный текст');
                    setIsProcessing(false);
                    return;
                }

                const queryForSemantic = `query: ${[normalizedInput, ...expandedTokens].join(' ')}`;
                addLog('Семантический поиск по смыслу, синонимам и опечаткам...');

                try {
                    const queryVectorBatch = await embedTexts([queryForSemantic], modelUSE);
                    const queryVector = queryVectorBatch[0] || queryVectorBatch;

                    let best = {
                        score: -Infinity,
                        fact: null,
                        index: -1,
                        breakdown: null
                    };

                    for (let i = 0; i < SEARCH_INDEX.length; i++) {
                        const semanticScore = cosineSimilarity(queryVector, factVectorsRef.current[i]);
                        const lexical = measureLexicalMatch(inputTokens, expandedTokens, i);

                        const totalScore = Math.min(
                            1,
                            semanticScore * 0.58 +
                            lexical.lexical * 0.34 +
                            lexical.weightedRecall * 0.04 +
                            lexical.anchorCoverage * 0.02 +
                            lexical.topicCoverage * 0.02
                        );

                        if (totalScore > best.score) {
                            best = {
                                score: totalScore,
                                fact: SEARCH_INDEX[i].text,
                                index: i,
                                breakdown: { semanticScore, ...lexical }
                            };
                        }
                    }

                    const threshold = acceptanceThreshold(inputTokens.length);
                    const semanticWeak = best.breakdown.semanticScore < 0.28;
                    const lexicalWeak = best.breakdown.lexical < 0.16;
                    const anchorWeak = best.breakdown.anchorCoverage < 0.10 && best.breakdown.topicCoverage < 0.10;

                    if (best.score < threshold || (semanticWeak && lexicalWeak) || (anchorWeak && best.breakdown.weightedRecall < 0.12)) {
                        setGeneratedText('Факт не найден. Попробуйте переформулировать запрос.');
                        setIsError(true);
                        addLog(`✗ Нет уверенного совпадения: score=${best.score.toFixed(3)}, sem=${best.breakdown.semanticScore.toFixed(3)}, lex=${best.breakdown.lexical.toFixed(3)}, threshold=${threshold.toFixed(3)}`);
                    } else {
                        setGeneratedText(best.fact);
                        setIsError(false);
                        addLog(`✓ Найден факт: score=${best.score.toFixed(3)}, sem=${best.breakdown.semanticScore.toFixed(3)}, lex=${best.breakdown.lexical.toFixed(3)}`);
                    }
                } catch (error) {
                    console.error(error);
                    setGeneratedText('Ошибка при обработке запроса.');
                    setIsError(true);
                    addLog('⚠ Ошибка семантического поиска: ' + error.message);
                }

                setIsProcessing(false);
            };

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-semibold text-gray-800 mb-2">AIzluchinsk</h1>
                            <p className="text-gray-600">Проект учеников школы МБОУ Излучинская ОСШУИОП №2</p>
                        </div>

                        {isLoading && (
                            <div className="mb-6 bg-white rounded-lg p-6 border shadow-sm">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-gray-700 font-medium">Загрузка семантической модели...</span>
                                    <span className="text-blue-600 font-semibold">{loadingProgress}%</span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                    <div
                                        className="bg-blue-600 h-3 rounded-full transition-all duration-300 ease-out"
                                        style={{ width: `${loadingProgress}%` }}
                                    />
                                </div>
                                <p className="text-sm text-gray-500 mt-2">Сейчас загружается более сильная модель понимания текста.</p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-2 bg-white rounded-lg p-6 border shadow-sm flex flex-col">
                                <h2 className="text-xl font-semibold mb-3">Информация о школе</h2>
                                <div className="h-64 overflow-y-auto p-3 bg-gray-50 border rounded mb-4 whitespace-pre-wrap text-gray-700">
                                    {defaultTrainingText}
                                </div>
                                <input
                                    value={startText}
                                    onChange={e => setStartText(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && !isLoading && !isProcessing && generateText()}
                                    placeholder="Введите вопрос..."
                                    className="w-full border rounded p-3 mb-3"
                                    disabled={isLoading || isProcessing}
                                />
                                <button
                                    onClick={generateText}
                                    disabled={isLoading || isProcessing}
                                    className="w-full bg-blue-600 text-white py-3 rounded mb-4 hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    {isProcessing ? (
                                        <>
                                            <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                                            </svg>
                                            Обработка...
                                        </>
                                    ) : 'Получить факт'}
                                </button>
                                {generatedText && (
                                    <div className={`border-l-4 ${isError ? 'border-red-600 bg-red-50' : 'border-blue-600 bg-blue-50'} p-4 rounded shadow`}>
                                        <h3 className={`font-semibold ${isError ? 'text-red-800' : 'text-blue-800'} mb-2`}>
                                            {isError ? '⚠ Результат поиска:' : '✓ Релевантный факт:'}
                                        </h3>
                                        <p className="text-gray-800">{generatedText}</p>
                                    </div>
                                )}
                            </div>

                            <div className="flex flex-col gap-6">
                                <div className="bg-white rounded-lg p-6 border shadow-sm">
                                    <h3 className="font-semibold mb-3">Консоль</h3>
                                    <div className="h-64 overflow-y-auto bg-gray-50 p-3 border rounded font-mono text-sm">
                                        {logs.map((l, i) => <div key={i} className="mb-1">{l}</div>)}
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg p-6 border shadow-sm">
                                    <h3 className="font-semibold mb-3">О AIzluchinsk</h3>
                                    <p className="text-gray-700 mb-2">
                                        Это NLP-модель, которая анализирует запросы пользователей и находит наиболее релевантные факты об МБОУ «Излучинская ОСШУИОП №2». Модель работает в три уровня: гибридный семантический поиск, расширение запроса синонимами и мягкая обработка опечаток.
                                    </p>
                                    <p className="text-gray-700 text-sm mt-3 pt-3 border-t">
                                        <strong>Авторы:</strong> Катренко Герман и Мокроусов Матвей
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<GenerativeTextAI />, document.getElementById('root'));

    </script>

</head>
<body>
    <div id="root"></div>

</body>
</html>
